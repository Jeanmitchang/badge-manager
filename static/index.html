<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#08080f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>VIGIK Badges</title>
<link rel="manifest" href="/static/manifest.json"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--s1:#111119;--s2:#18181f;--s3:#22222c;
  --border:#252530;--border2:#2e2e3d;
  --text:#eeeeff;--muted:#55556a;--muted2:#3a3a50;
  --accent:#7c6fff;--accent2:#a78bfa;
  --green:#22c55e;--red:#ef4444;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 16px;background:linear-gradient(180deg,#0f0f1a,transparent);border-bottom:1px solid var(--border);flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7c6fff18,#5a4fff28);border:1px solid #6c63ff2a;display:flex;align-items:center;justify-content:center;font-size:20px}
.header-title{font-size:19px;font-weight:800;letter-spacing:-.3px}
.header-sub{font-size:11px;color:var(--muted);margin-top:1px}
.btn-add{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7c6fff,#5a4fff);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;color:#fff;box-shadow:0 4px 16px #6c63ff44;border:none;transition:transform .12s}
.btn-add:active{transform:scale(.92)}

/* Main */
.main{flex:1;overflow-y:auto;padding:18px 14px;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{width:0}
.section-label{font-size:11px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px}

/* Badge grid */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* Badge card */
.badge-card{background:linear-gradient(145deg,var(--s2),var(--s1));border:1px solid var(--border);border-radius:20px;padding:16px 14px 14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.badge-card:active{transform:scale(.95)}
.badge-glow{position:absolute;top:-30px;right:-20px;width:90px;height:90px;border-radius:50%;filter:blur(28px);opacity:.15;pointer-events:none}
.badge-bar{position:absolute;bottom:0;left:0;right:0;height:3px;opacity:.5}
.badge-emoji{font-size:32px;margin-bottom:11px;display:block;filter:drop-shadow(0 2px 8px #0006)}
.badge-name{font-size:14px;font-weight:700;color:#f0f0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.badge-uid{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.5px}
.badge-date{font-size:10px;color:var(--muted2);margin-top:9px}

/* Add card */
.add-card{background:transparent;border:1.5px dashed var(--border);border-radius:20px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.add-card:active{background:var(--s2)}
.add-icon{width:34px;height:34px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
.add-label{font-size:12px;color:var(--muted2)}

/* Status bar */
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--s1);border-top:1px solid var(--border);flex-shrink:0}
.status-left{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.status-dot.offline{background:var(--red)}
.status-count{font-size:11px;color:var(--muted2)}

/* Overlay / sheet */
.overlay{position:fixed;inset:0;background:#000b;backdrop-filter:blur(10px);z-index:100;opacity:0;pointer-events:none;transition:opacity .22s;display:flex;align-items:flex-end}
.overlay.open{opacity:1;pointer-events:all}
.sheet{width:100%;background:linear-gradient(180deg,var(--s2),var(--s1));border-radius:24px 24px 0 0;border:1px solid var(--border2);border-bottom:none;padding:12px 20px;padding-bottom:calc(32px + var(--safe-bot));transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto}
.sheet::-webkit-scrollbar{width:0}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:20px;color:#f0f0ff}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:transform .12s,opacity .12s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97);opacity:.85}
.btn+.btn{margin-top:10px}
.btn-primary{background:linear-gradient(135deg,#7c6fff,#5a4fff);color:#fff;box-shadow:0 4px 24px #6c63ff44}
.btn-ghost{background:#ffffff08;color:#c0c0e0;border:1px solid #ffffff10}
.btn-danger{background:#ef444412;color:#ef4444;border:1px solid #ef444428}
.btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 20px #22c55e33}

/* Form */
.form-group{margin-bottom:16px}
.form-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:8px}
.form-input{width:100%;background:var(--s3);border:1.5px solid var(--border2);border-radius:12px;color:var(--text);font-size:15px;padding:13px 14px;outline:none;font-family:'DM Sans',sans-serif;transition:border-color .2s}
.form-input:focus{border-color:#7c6fff66}
.form-input.mono{font-family:'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase}
.icon-grid{display:flex;flex-wrap:wrap;gap:8px}
.icon-opt{width:44px;height:44px;border-radius:12px;background:var(--s3);border:1.5px solid var(--border);font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.icon-opt.sel{border-color:var(--accent);background:#7c6fff18;box-shadow:0 0 12px #6c63ff33}
.color-grid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:8px}
.color-opt{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s,border-color .12s}
.color-opt.sel{border-color:#fff;transform:scale(1.2)}

/* Encoding overlay */
#enc-overlay{position:fixed;inset:0;background:#000e;backdrop-filter:blur(14px);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#enc-overlay.show{opacity:1;pointer-events:all}
.enc-ring-wrap{position:relative;width:80px;height:80px}
.enc-ring{position:absolute;inset:0;border:3px solid transparent;border-radius:50%}
.enc-outer{border-color:#6c63ff22;border-top-color:#7c6fff;animation:spin 1s linear infinite}
.enc-inner{inset:12px;border-color:#a78bfa22;border-top-color:#a78bfa;animation:spin .65s linear infinite reverse}
.enc-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.enc-title{font-size:17px;font-weight:700;text-align:center}
.enc-sub{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;text-align:center;animation:pulse 1.6s ease infinite}
.enc-uid{background:var(--s2);border:1px solid var(--border2);border-radius:10px;padding:8px 16px;font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:1px}

/* Login */
#login-screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#7c6fff12 0%,transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;padding:24px}
.login-box{width:100%;max-width:320px}
.login-logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#7c6fff18,#5a4fff30);border:1px solid #6c63ff33;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;box-shadow:0 0 50px #6c63ff22}
.login-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px}
.login-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:32px}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px}

/* Toast */
#toast{position:fixed;bottom:calc(72px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(14px);background:var(--s3);border:1px solid var(--border2);border-radius:20px;padding:10px 20px;font-size:13px;z-index:400;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px #0008}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty state */
.empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:12px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🏷️</div>
    <div class="login-title">VIGIK Manager</div>
    <div class="login-sub">Accès sécurisé</div>
    <div class="form-group">
      <input id="pwd-input" class="form-input" type="password" placeholder="••••••••"
             autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Connexion</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app" style="display:none">
  <div class="header">
    <div class="header-left">
      <div class="header-icon">🏷️</div>
      <div>
        <div class="header-title">VIGIK Badges</div>
        <div class="header-sub" id="header-sub">Chargement...</div>
      </div>
    </div>
    <button class="btn-add" onclick="openAdd()">＋</button>
  </div>

  <div class="main">
    <div class="section-label" id="section-label">Mes badges</div>
    <div class="badge-grid" id="badge-grid">
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">🏷️</div>
        <div>Chargement...</div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Connexion...</span>
    </div>
    <div class="status-count" id="status-count"></div>
  </div>

  <!-- Options sheet -->
  <div class="overlay" id="opt-overlay" onclick="if(event.target===this)closeOverlay('opt-overlay')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="opt-title"></div>
      <button class="btn btn-primary" onclick="doEncode()">⚡ Encoder ce badge</button>
      <button class="btn btn-ghost" onclick="openEdit()">✏️ Modifier</button>
      <button class="btn btn-danger" onclick="doDelete()">🗑️ Supprimer</button>
    </div>
  </div>

  <!-- Form sheet -->
  <div class="overlay" id="form-overlay" onclick="if(event.target===this)closeOverlay('form-overlay')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="form-title">Nouveau badge</div>
      <div class="form-group">
        <label class="form-label">Nom du badge</label>
        <input id="f-name" class="form-input" type="text" placeholder="ex: Papa, Visiteur…" maxlength="50"/>
      </div>
      <div class="form-group">
        <label class="form-label">UID carte (8 hex)</label>
        <input id="f-uid" class="form-input mono" type="text" placeholder="ex: 8ABC1E53" maxlength="8"
               oninput="this.value=this.value.replace(/[^0-9A-Fa-f]/g,'').toUpperCase()"/>
      </div>
      <div class="form-group">
        <label class="form-label">Icône</label>
        <div class="icon-grid" id="icon-grid"></div>
      </div>
      <div class="form-group" style="margin-bottom:24px">
        <label class="form-label">Couleur</label>
        <div class="color-grid" id="color-grid"></div>
      </div>
      <button class="btn btn-primary" id="form-save-btn" onclick="saveBadge()">Enregistrer</button>
      <button class="btn btn-ghost" onclick="closeOverlay('form-overlay')">Annuler</button>
    </div>
  </div>

  <!-- Result sheet -->
  <div class="overlay" id="result-overlay" onclick="if(event.target===this)closeOverlay('result-overlay')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div style="text-align:center;padding:8px 0 16px">
        <div style="font-size:58px;margin-bottom:14px;filter:drop-shadow(0 4px 18px #22c55e44)">✅</div>
        <div style="font-size:21px;font-weight:800;margin-bottom:6px">Badge généré !</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:28px" id="result-sub"></div>
        <button class="btn btn-success" onclick="downloadMct()">⬇️ Télécharger le .mct</button>
        <button class="btn btn-ghost" onclick="openMct()">📱 Ouvrir dans Mifare Classic Tool</button>
        <button class="btn btn-ghost" onclick="closeOverlay('result-overlay')">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Encoding overlay -->
  <div id="enc-overlay">
    <div class="enc-ring-wrap">
      <div class="enc-ring enc-outer"></div>
      <div class="enc-ring enc-inner"></div>
      <div class="enc-emoji" id="enc-emoji">🏷️</div>
    </div>
    <div class="enc-title">Encodage en cours…</div>
    <div class="enc-sub">wine vigik_loader_cli.exe · génération MCT</div>
    <div class="enc-uid" id="enc-uid">UID: --------</div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '';
const ICONS  = ['🏠','👤','👨','👩','🔑','🚗','🐕','📦','⭐','🛡️','👶','🏢','🎯','🏋️','🧓'];
const COLORS = ['#7c6fff','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#06b6d4','#84cc16','#f97316'];

let TOKEN = localStorage.getItem('vigik_token') || '';
let badges = [];
let selected = null;
let formMode = 'add';
let selIcon  = ICONS[0];
let selColor = COLORS[0];
let mctBlob  = null;
let mctFilename = '';

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  buildPickers();
  if (TOKEN) {
    try { await loadBadges(); showApp(); }
    catch { TOKEN = ''; localStorage.removeItem('vigik_token'); }
  }
  checkHealth();
  setInterval(checkHealth, 30000);
});

// ── Auth ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  const err = document.getElementById('login-error');
  if (!pwd) return;
  try {
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pwd})
    });
    if (!r.ok) { err.textContent = 'Mot de passe incorrect'; return; }
    TOKEN = (await r.json()).token;
    localStorage.setItem('vigik_token', TOKEN);
    err.textContent = '';
    await loadBadges();
    showApp();
  } catch { err.textContent = 'Serveur inaccessible'; }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

// ── API ───────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  if (r.status === 401) { TOKEN = ''; localStorage.removeItem('vigik_token'); location.reload(); }
  return r;
}

// ── Health ────────────────────────────────────────────────────────────────────
async function checkHealth() {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const d = await (await fetch('/api/health')).json();
    const ok = d.wine && d.vigik_exe && d.cert;
    dot.className = 'status-dot' + (ok ? '' : ' offline');
    text.textContent = ok ? `Wine ✓ · vigik ✓ · cert ✓` : `⚠️ ${!d.wine?'Wine ':''} ${!d.vigik_exe?'vigik_exe ':''} ${!d.cert?'cert.txt':''} manquant`;
    document.getElementById('header-sub').textContent = ok ? 'Système opérationnel' : 'Configuration incomplète';
  } catch {
    dot.className = 'status-dot offline';
    text.textContent = 'Serveur inaccessible';
    document.getElementById('header-sub').textContent = 'Hors ligne';
  }
}

// ── Badges ────────────────────────────────────────────────────────────────────
async function loadBadges() {
  const r = await api('/api/badges');
  if (!r.ok) throw new Error();
  badges = await r.json();
  renderBadges();
}

function renderBadges() {
  const g = document.getElementById('badge-grid');
  const n = badges.length;
  document.getElementById('section-label').textContent = `Mes badges · ${n}`;
  document.getElementById('status-count').textContent = `${n} badge${n>1?'s':''}`;

  if (n === 0) {
    g.innerHTML = `<div class="empty"><div class="empty-icon">🏷️</div><div>Aucun badge — appuyer sur + pour commencer</div></div>`;
    return;
  }

  g.innerHTML = badges.map((b, i) => `
    <div class="badge-card" style="animation:cardIn .35s ease ${i*.07}s both"
         onclick="openOpt('${b.id}')"
         onmouseenter="this.style.borderColor='${b.color}55';this.style.boxShadow='0 8px 28px ${b.color}22'"
         onmouseleave="this.style.borderColor='';this.style.boxShadow=''">
      <div class="badge-glow" style="background:${b.color}"></div>
      <div class="badge-bar"  style="background:linear-gradient(90deg,${b.color}00,${b.color},${b.color}00)"></div>
      <span class="badge-emoji">${b.icon}</span>
      <div class="badge-name">${esc(b.name)}</div>
      <div class="badge-uid">${b.uid}</div>
      <div class="badge-date">${b.last_encoded ? '↻ ' + fmtDate(b.last_encoded) : '<span style="font-style:italic;color:#2a2a40">Jamais encodé</span>'}</div>
    </div>
  `).join('') + `
    <div class="add-card" onclick="openAdd()">
      <div class="add-icon">＋</div>
      <div class="add-label">Nouveau badge</div>
    </div>`;
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Options ───────────────────────────────────────────────────────────────────
function openOpt(id) {
  selected = badges.find(b => b.id === id);
  document.getElementById('opt-title').textContent = `${selected.icon} ${selected.name}`;
  openOverlay('opt-overlay');
}

// ── Encode ────────────────────────────────────────────────────────────────────
async function doEncode() {
  closeOverlay('opt-overlay');
  document.getElementById('enc-emoji').textContent = selected.icon;
  document.getElementById('enc-uid').textContent   = 'UID: ' + selected.uid;
  document.getElementById('enc-overlay').classList.add('show');
  try {
    const r = await api(`/api/badges/${selected.id}/encode`, {method:'POST'});
    if (!r.ok) { const e = await r.json().catch(()=>({detail:'Erreur'})); throw new Error(e.detail); }
    mctBlob = await r.blob();
    const cd = r.headers.get('content-disposition') || '';
    mctFilename = cd.match(/filename="?([^"]+)"?/)?.[1] || `vigik_${selected.name}_${selected.uid}.mct`;
    const b = badges.find(b => b.id === selected.id);
    if (b) b.last_encoded = new Date().toISOString();
    renderBadges();
    document.getElementById('result-sub').textContent = `${selected.icon} ${selected.name} · ${selected.uid}`;
    openOverlay('result-overlay');
  } catch(e) {
    toast('❌ ' + e.message, 4000);
  } finally {
    document.getElementById('enc-overlay').classList.remove('show');
  }
}

function downloadMct() {
  if (!mctBlob) return;
  const url = URL.createObjectURL(mctBlob);
  const a = Object.assign(document.createElement('a'), {href:url, download:mctFilename});
  a.click(); URL.revokeObjectURL(url);
  toast('⬇️ Fichier téléchargé');
}

function openMct() {
  downloadMct();
  setTimeout(() => { window.location.href = 'intent://import#Intent;scheme=mifareclassictool;package=de.syss.MifareClassicTool;end'; }, 800);
}

// ── Form ──────────────────────────────────────────────────────────────────────
function buildPickers() {
  document.getElementById('icon-grid').innerHTML = ICONS.map(i =>
    `<div class="icon-opt${i===selIcon?' sel':''}" onclick="pickIcon('${i}')">${i}</div>`
  ).join('');
  document.getElementById('color-grid').innerHTML = COLORS.map(c =>
    `<div class="color-opt${c===selColor?' sel':''}" style="background:${c};${c===selColor?'box-shadow:0 0 12px '+c+'88':''}" onclick="pickColor('${c}')"></div>`
  ).join('');
}

function pickIcon(i)  { selIcon  = i; refreshPickers(); }
function pickColor(c) { selColor = c; refreshPickers(); }

function refreshPickers() {
  document.querySelectorAll('.icon-opt').forEach((el, i) => {
    el.className = 'icon-opt' + (ICONS[i] === selIcon ? ' sel' : '');
    el.onclick = () => pickIcon(ICONS[i]);
  });
  document.querySelectorAll('.color-opt').forEach((el, i) => {
    el.className = 'color-opt' + (COLORS[i] === selColor ? ' sel' : '');
    el.style.boxShadow = COLORS[i] === selColor ? `0 0 12px ${COLORS[i]}88` : '';
    el.style.transform = COLORS[i] === selColor ? 'scale(1.2)' : '';
    el.onclick = () => pickColor(COLORS[i]);
  });
}

function openAdd() {
  formMode = 'add'; selIcon = ICONS[0]; selColor = COLORS[0];
  document.getElementById('form-title').textContent = '➕ Nouveau badge';
  document.getElementById('f-name').value = '';
  document.getElementById('f-uid').value  = '';
  document.getElementById('form-save-btn').textContent = 'Enregistrer';
  refreshPickers();
  openOverlay('form-overlay');
  setTimeout(() => document.getElementById('f-name').focus(), 300);
}

function openEdit() {
  closeOverlay('opt-overlay');
  formMode = 'edit'; selIcon = selected.icon; selColor = selected.color;
  document.getElementById('form-title').textContent = `✏️ Modifier — ${selected.name}`;
  document.getElementById('f-name').value = selected.name;
  document.getElementById('f-uid').value  = selected.uid;
  document.getElementById('form-save-btn').textContent = 'Mettre à jour';
  refreshPickers();
  openOverlay('form-overlay');
}

async function saveBadge() {
  const name  = document.getElementById('f-name').value.trim();
  const uid   = document.getElementById('f-uid').value.trim().toUpperCase();
  if (!name)                       { toast('⚠️ Nom requis'); return; }
  if (!/^[0-9A-F]{8}$/.test(uid)) { toast('⚠️ UID invalide (8 hex)'); return; }
  const body = JSON.stringify({name, uid, icon:selIcon, color:selColor});
  try {
    if (formMode === 'add') {
      const r = await api('/api/badges', {method:'POST', body});
      if (r.status === 409) { toast('⚠️ UID déjà enregistré'); return; }
      if (!r.ok) throw new Error();
      badges.push(await r.json());
      toast('✅ Badge ajouté');
    } else {
      const r = await api(`/api/badges/${selected.id}`, {method:'PATCH', body});
      if (!r.ok) throw new Error();
      const idx = badges.findIndex(b => b.id === selected.id);
      if (idx >= 0) badges[idx] = await r.json();
      toast('✅ Badge mis à jour');
    }
    renderBadges();
    closeOverlay('form-overlay');
  } catch { toast('❌ Erreur sauvegarde'); }
}

async function doDelete() {
  closeOverlay('opt-overlay');
  if (!confirm(`Supprimer "${selected.name}" ?`)) return;
  try {
    await api(`/api/badges/${selected.id}`, {method:'DELETE'});
    badges = badges.filter(b => b.id !== selected.id);
    renderBadges();
    toast('🗑️ Badge supprimé');
  } catch { toast('❌ Erreur suppression'); }
}

// ── Overlays ──────────────────────────────────────────────────────────────────
function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

// ── Toast ─────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg, dur=2600) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), dur);
}
</script>
</body>
</html>
